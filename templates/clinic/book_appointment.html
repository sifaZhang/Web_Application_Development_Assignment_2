{% extends "clinic/base_clinic.html" %}

{% block title %}Book Appointment{% endblock %}

{% block content %}
<div class="container mt-4">

    <h3 class="text-primary mb-3">Book a New Appointment</h3>

    <!-- Step 1: Doctor + Date -->
    <form method="GET" class="mb-4">

        <!-- Doctor -->
        <div class="mb-3">
            <label class="form-label">Select Doctor</label>
            <select name="doctor" class="form-select" required>
                <option value="">-- Choose a doctor --</option>
                {% for d in doctors %}
                <option value="{{ d.id }}" {% if selected_doctor == d.id|stringformat:"s" %}selected{% endif %}>
                    {{ d.name }} | Specialty: {{ d.specialty }} | Description: {{ d.description }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Date -->
        <div class="mb-3">
            <label class="form-label">Select Date</label>
            <input type="date" name="date" class="form-control"
                   value="{{ selected_date }}" required>
        </div>

        <button class="btn btn-primary">Show Available Slots</button>
    </form>


    <!-- Step 2: Slot selection -->
    {% if slots %}
    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Available Slots</label>
            <select name="slot" id="slotSelect" class="form-select" required>
                <option value="">-- Choose a slot --</option>
                {% for s in slots %}
                <option value="{{ s.id }}" data-time="{{ s.time|time:'H:i' }}">
                    {{ s.time|time:"H:i" }}
                </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Confirm Booking</button>
    </form>

    {% elif selected_doctor and selected_date %}
    <div class="alert alert-warning">
        No available slots for this doctor on this date.
    </div>
    {% endif %}

</div>

<!-- JavaScript：格式化 slot 显示 -->
<script>
function formatTime(t) {
    if (!t) return "";
    let [hour, minute] = t.split(":").map(Number);
    let ampm = hour >= 12 ? "pm" : "am";
    hour = hour % 12;
    if (hour === 0) hour = 12;
    return `${hour}:${minute.toString().padStart(2, "0")} ${ampm}`;
}

function addMinutes(t, mins) {
    let [hour, minute] = t.split(":").map(Number);
    let total = hour * 60 + minute + mins;
    let newHour = Math.floor(total / 60);
    let newMin = total % 60;
    return `${newHour.toString().padStart(2, "0")}:${newMin.toString().padStart(2, "0")}`;
}

document.querySelectorAll("#slotSelect option[data-time]").forEach(opt => {
    let t = opt.dataset.time;
    let end = addMinutes(t, 14);
    opt.textContent = `${formatTime(t)} - ${formatTime(end)}`;
});
</script>

{% endblock %}
